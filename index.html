<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>Weight & Mood Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#263348;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:22px 14px 70px}h1{font-size:25px;margin:0 0 5px}h2{font-size:17px;margin:0 0 16px}.sub{color:#738096;font-size:13px;margin:0 0 22px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 18px #2633480a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border-radius:15px;padding:15px 10px;text-align:center}.stat small{display:block;color:#718096;font-size:11px}.stat strong{font-size:22px;display:block;margin-top:7px}.stat span{font-size:11px;color:#77849a}label{display:block;font-size:13px;font-weight:650;margin:12px 0 7px}input,textarea,select{width:100%;border:1px solid #dce3ed;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#263348}textarea{resize:vertical;min-height:70px}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.moods input{position:absolute;opacity:0;width:1px}.moods label{margin:0;border:1px solid #e1e7ef;border-radius:12px;text-align:center;padding:10px 2px;font-size:12px;cursor:pointer}.moods b{font-size:24px;display:block;margin-bottom:4px}.moods input:checked+label{background:#e8f0ff;border-color:#5785d5;color:#2457ad}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button,.filelabel{border:0;border-radius:10px;background:#326dd0;color:white;padding:11px 16px;font-weight:650;cursor:pointer;font:inherit;font-size:13px}.secondary{background:#eaf0f8;color:#34516f}.danger{background:#fff0f0;color:#b23e49}.filelabel{display:inline-block;margin:0}.filelabel input{display:none}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{background:#edf2f8;color:#55647c}.tabs button.active{background:#326dd0;color:white}canvas{width:100%;height:260px;display:block}.hint{color:#7b8798;font-size:12px}.record{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eef1f6;padding:12px 0;gap:10px}.record .meta{font-size:12px;color:#758298}.record strong{font-size:15px}.record button{padding:7px 9px}.record .buttons{display:flex;gap:5px;flex-shrink:0}.empty{color:#8894a5;text-align:center;padding:22px}.note{font-size:12px;color:#65748a;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.stats{gap:6px}.stat{padding:13px 4px}.stat strong{font-size:18px}.card{padding:16px}.moods label{font-size:10px}.moods b{font-size:21px}.record{align-items:flex-start}} </style></head><body><main><h1>🌿 Weight & Mood Tracker</h1><p class="sub">日々の小さな変化を、無理なく振り返るために。</p><section class="stats"><div class="stat"><small>最新の体重</small><strong id="latest">—</strong><span>kg</span></div><div class="stat"><small>前回との差</small><strong id="diff">—</strong><span>kg</span></div><div class="stat"><small>直近7件の平均気分</small><strong id="avg">—</strong><span>5点満点</span></div></section><section class="card"><h2>日時ごとの記録</h2><form id="form"><div class="row"><div><label for="date">日付</label><input id="date" type="date" required></div><div><label for="time">時刻</label><input id="time" type="time" required></div><div><label for="weight">体重（kg）</label><input id="weight" type="number" min="20" max="350" step="0.1" placeholder="例：73.0"></div></div><label>その時のメンタル（5段階）</label><div class="moods" id="moods"><div><input type="radio" name="mood" id="m1" value="1"><label for="m1"><b>😞</b>とても悪い</label></div><div><input type="radio" name="mood" id="m2" value="2"><label for="m2"><b>😟</b>悪い</label></div><div><input type="radio" name="mood" id="m3" value="3"><label for="m3"><b>😐</b>普通</label></div><div><input type="radio" name="mood" id="m4" value="4"><label for="m4"><b>🙂</b>良い</label></div><div><input type="radio" name="mood" id="m5" value="5"><label for="m5"><b>😄</b>とても良い</label></div></div><label for="memo">メモ（任意）</label><textarea id="memo" placeholder="睡眠、運動、気分の変化、出来事など"></textarea><div class="actions"><button type="submit">記録を保存</button><button type="button" class="secondary" id="reset">入力をクリア</button></div><p class="hint" id="status" role="status">同じ日時の記録は上書きします。1日に何度でも記録できます。</p></form></section><section class="card"><h2>推移グラフ</h2><div class="tabs"><button class="active" data-chart="weight">体重</button><button data-chart="mood">メンタル</button></div><div class="row" style="margin-top:12px"><div><label for="period">表示期間</label><select id="period"><option value="14">直近14日</option><option value="30" selected>直近30日</option><option value="90">直近90日</option><option value="all">全期間</option></select></div></div><canvas id="chart" role="img" aria-label="記録の推移グラフ"></canvas><p class="hint">記録した日時に沿って点を表示します。メンタルは1（とても悪い）〜5（とても良い）です。</p></section><section class="card"><h2>記録一覧</h2><div id="records"></div></section><section class="card"><h2>データのバックアップ</h2><p class="hint">データはこのブラウザ内に保存されます。端末変更やブラウザのデータ削除に備え、定期的にバックアップしてください。</p><div class="actions"><button class="secondary" id="csv" type="button">CSVを書き出す</button><button class="secondary" id="json" type="button">バックアップ保存</button><label class="filelabel secondary">バックアップ復元<input id="import" type="file" accept=".json,application/json"></label></div></section></main><script>
(()=>{'use strict';
const KEY='wellbeing-tracker-v2', OLD='wellbeing-tracker-v1', $=id=>document.getElementById(id);
const num=v=>typeof v==='number'&&Number.isFinite(v);
const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'');
const validTime=v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v||'');
const normalize=x=>({date:x.date,time:validTime(x.time)?x.time:'12:00',weight:num(x.weight)?x.weight:null,mood:Number.isInteger(x.mood)?x.mood:null,memo:typeof x.memo==='string'?x.memo:''});
let entries=[];
try{const raw=localStorage.getItem(KEY);const old=raw===null;const v=JSON.parse(raw??localStorage.getItem(OLD)??'[]');if(Array.isArray(v))entries=v.filter(x=>x&&validDate(x.date)).map(normalize);if(old&&entries.length)localStorage.setItem(KEY,JSON.stringify(entries));}catch{}
const now=()=>new Date();const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const localTime=d=>[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0')].join(':');
const stamp=e=>e.date+'T'+e.time;const sorted=()=>[...entries].sort((a,b)=>stamp(a).localeCompare(stamp(b)));
const dateMs=e=>new Date(stamp(e)+':00').getTime();
function reset(){ const openedAt=now(); $('form').reset();$('date').value=localDate(openedAt);$('time').value=localTime(openedAt);$('status').textContent='新しい記録を入力できます。';}
reset();let mode='weight';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch{alert('保存できませんでした。ブラウザの保存領域をご確認ください。');return false}}
function render(){const s=sorted(),w=s.filter(e=>num(e.weight)),m=s.filter(e=>num(e.mood));
$('latest').textContent=w.length?w.at(-1).weight.toFixed(1):'—';$('diff').textContent=w.length>1?((w.at(-1).weight-w.at(-2).weight)>0?'+':'')+(w.at(-1).weight-w.at(-2).weight).toFixed(1):'—';$('avg').textContent=m.length?(m.slice(-7).reduce((a,e)=>a+e.mood,0)/Math.min(m.length,7)).toFixed(1):'—';
const root=$('records');root.replaceChildren();if(!s.length){const p=document.createElement('p');p.className='empty';p.textContent='まだ記録がありません';root.append(p)}
for(const e of s.reverse()){const wrap=document.createElement('div');wrap.className='record';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=e.date+' '+e.time+'　'+(num(e.weight)?e.weight.toFixed(1)+' kg':'体重なし');const meta=document.createElement('div');meta.className='meta';meta.textContent=num(e.mood)?['','😞 とても悪い','😟 悪い','😐 普通','🙂 良い','😄 とても良い'][e.mood]:'気分なし';info.append(title,meta);if(e.memo){const n=document.createElement('div');n.className='note';n.textContent=e.memo;info.append(n)}const bs=document.createElement('div');bs.className='buttons';const edit=document.createElement('button');edit.className='secondary';edit.textContent='編集';edit.onclick=()=>{$('date').value=e.date;$('time').value=e.time;$('weight').value=num(e.weight)?e.weight:'';$('memo').value=e.memo;document.querySelectorAll('input[name=mood]').forEach(x=>x.checked=Number(x.value)===e.mood);$('status').textContent='編集後に保存してください。日時を変更した場合は新規記録になります。';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(confirm(e.date+' '+e.time+' の記録を削除しますか？')){entries=entries.filter(x=>stamp(x)!==stamp(e));if(persist())render()}};bs.append(edit,del);wrap.append(info,bs);root.append(wrap)}draw()}
function draw(){const canvas=$('chart'),rect=canvas.getBoundingClientRect(),width=Math.max(rect.width,250),height=260,dpr=window.devicePixelRatio||1;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,width,height);let data=sorted();const days=$('period').value;if(days!=='all'){const cutoff=now();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-Number(days)+1);data=data.filter(x=>dateMs(x)>=cutoff.getTime()&&dateMs(x)<=now().getTime())}const key=mode,valid=data.filter(x=>num(x[key]));if(!valid.length){c.fillStyle='#8793a5';c.textAlign='center';c.font='14px sans-serif';c.fillText('この期間の記録はありません',width/2,height/2);return}
const l=47,r=13,t=17,b=40,plotW=width-l-r,plotH=height-t-b;let min=mode==='mood'?1:Math.min(...valid.map(x=>x[key]))-0.5,max=mode==='mood'?5:Math.max(...valid.map(x=>x[key]))+0.5;if(max-min<1){min-=0.5;max+=0.5}const start=dateMs(valid[0]),end=dateMs(valid.at(-1)),span=Math.max(3600000,end-start);const x=e=>l+(dateMs(e)-start)/span*plotW,y=v=>t+(max-v)/(max-min)*plotH;
c.font='11px sans-serif';c.textAlign='right';for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,yy=y(v);c.strokeStyle='#e8edf5';c.beginPath();c.moveTo(l,yy);c.lineTo(width-r,yy);c.stroke();c.fillStyle='#758399';c.fillText(mode==='mood'?v.toFixed(0):v.toFixed(1),l-7,yy+4)}const fmt=e=>e.date.slice(5).replace('-','/')+' '+e.time;c.textAlign='left';c.fillText(fmt(valid[0]),l,height-13);c.textAlign='right';c.fillText(fmt(valid.at(-1)),width-r,height-13);c.strokeStyle=mode==='weight'?'#326dd0':'#18a38a';c.lineWidth=2.5;c.beginPath();for(let i=1;i<valid.length;i++){c.moveTo(x(valid[i-1]),y(valid[i-1][key]));c.lineTo(x(valid[i]),y(valid[i][key]))}c.stroke();for(const e of valid){c.beginPath();c.arc(x(e),y(e[key]),3.5,0,Math.PI*2);c.fillStyle=mode==='weight'?'#326dd0':'#18a38a';c.fill()}}
$('form').onsubmit=ev=>{ev.preventDefault();const date=$('date').value,time=$('time').value,weight=$('weight').value.trim(),mood=document.querySelector('input[name=mood]:checked'),memo=$('memo').value.trim();if(!validDate(date)||!validTime(time)){alert('日時を確認してください。');return}if(!weight&&!mood&&!memo){alert('体重、気分、メモのいずれかを入力してください。');return}if(weight&&(!Number.isFinite(Number(weight))||Number(weight)<20||Number(weight)>350)){alert('体重を確認してください。');return}const item={date,time,weight:weight?Number(weight):null,mood:mood?Number(mood.value):null,memo};entries=entries.filter(x=>stamp(x)!==stamp(item));entries.push(item);if(persist()){render();reset();$('status').textContent=date+' '+time+' の記録を保存しました。'}};
$('reset').onclick=reset;document.querySelectorAll('[data-chart]').forEach(b=>b.onclick=()=>{mode=b.dataset.chart;document.querySelectorAll('[data-chart]').forEach(x=>x.classList.toggle('active',x===b));draw()});$('period').onchange=draw;window.addEventListener('resize',draw);
function download(text,name,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('json').onclick=()=>download(JSON.stringify(sorted(),null,2),'体重メンタル記録_バックアップ.json','application/json');$('csv').onclick=()=>{const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('\ufeff'+'日付,時刻,体重kg,メンタル1-5,メモ\r\n'+sorted().map(e=>[e.date,e.time,e.weight,e.mood,e.memo].map(esc).join(',')).join('\r\n'),'体重メンタル記録.csv','text/csv;charset=utf-8')};
$('import').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj)||!obj.every(x=>x&&validDate(x.date)&&(x.time==null||validTime(x.time))&&(x.weight==null||(num(x.weight)&&x.weight>=20&&x.weight<=350))&&(x.mood==null||(Number.isInteger(x.mood)&&x.mood>=1&&x.mood<=5))&&(x.memo==null||typeof x.memo==='string')))throw Error('形式が正しくありません');if(confirm('現在の記録をバックアップの内容で置き換えますか？')){entries=obj.map(normalize);if(persist())render()}}catch{alert('読み込めないバックアップファイルです。')}ev.target.value=''};
render();})();
</script></body></html>
